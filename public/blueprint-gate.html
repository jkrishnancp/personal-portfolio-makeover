<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blueprint Access | Jay Prakash</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #fafaf8;
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 500px 400px at 10% 10%, rgba(194,65,12,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 90% 90%, rgba(15,118,110,0.06) 0%, transparent 70%);
    }
    .card {
      position: relative; z-index: 1; background: #fff;
      border: 1px solid #e7e2dc; border-radius: 24px; padding: 44px 40px;
      max-width: 400px; width: 100%; box-shadow: 0 8px 40px rgba(28,25,23,0.08);
    }
    .logo { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 18px; font-weight: 700; color: #c2410c; margin-bottom: 24px; display: block; text-decoration: none; }
    .badge { display: inline-block; background: #c2410c; color: #fff; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: .16em; text-transform: uppercase; padding: 4px 12px; border-radius: 100px; margin-bottom: 14px; }
    h1 { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 26px; font-weight: 700; color: #1c1917; line-height: 1.2; margin-bottom: 8px; }
    .sub { font-size: 13px; color: #78716c; line-height: 1.6; margin-bottom: 24px; }
    label { display: block; font-family: 'DM Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: #78716c; margin-bottom: 5px; }
    input { width: 100%; padding: 11px 14px; border: 1px solid #e7e2dc; border-radius: 12px; font-size: 14px; font-family: inherit; color: #1c1917; background: #fafaf8; margin-bottom: 14px; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: #c2410c; box-shadow: 0 0 0 3px rgba(194,65,12,.1); }
    .otp-input { font-family: 'DM Mono', monospace; font-size: 24px; letter-spacing: 8px; text-align: center; }
    button { width: 100%; padding: 13px; background: #c2410c; color: #fff; border: none; border-radius: 12px; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; transition: background .15s; }
    button:hover:not(:disabled) { background: #a83209; }
    button:disabled { background: #e7e2dc; color: #a8a29e; cursor: not-allowed; }
    #msg { margin-top: 12px; font-size: 12px; text-align: center; min-height: 16px; }
    .note { margin-top: 18px; font-size: 11px; color: #a8a29e; text-align: center; line-height: 1.5; }
    .resend-link { margin-top: 10px; text-align: center; font-size: 12px; color: #78716c; }
    .resend-link button { width: auto; padding: 0; background: none; color: #c2410c; font-size: 12px; font-weight: 500; display: inline; text-decoration: underline; cursor: pointer; }
    .resend-link button:hover { background: none; color: #a83209; }
    #step2 { display: none; }
    .check-inbox { text-align: center; margin-bottom: 20px; }
    .check-inbox .icon { font-size: 32px; margin-bottom: 8px; }
    .check-inbox p { font-size: 13px; color: #78716c; }
    .check-inbox strong { color: #1c1917; }
    .timer { font-family: 'DM Mono', monospace; font-size: 11px; color: #a8a29e; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">Jay Prakash</a>

    <!-- Step 1: Name + Work Email -->
    <div id="step1">
      <span class="badge">Security Blueprints</span>
      <h1>Access this blueprint</h1>
      <p class="sub">Enter your work email to receive a verification code. Takes 30 seconds.</p>
      <form id="form1" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Your name" required autocomplete="name" />
        <label for="email">Work Email</label>
        <input type="email" id="email" placeholder="you@company.com" required autocomplete="email" />
        <button type="submit" id="btn1">Send verification code →</button>
      </form>
      <div id="msg1"></div>
      <p class="note">Only corporate/work emails accepted. No spam, ever.</p>
    </div>

    <!-- Step 2: OTP -->
    <div id="step2">
      <span class="badge">Check your inbox</span>
      <div class="check-inbox">
        <div class="icon">📧</div>
        <h1>Enter your code</h1>
        <p>We sent a 6-digit code to <strong id="email-display"></strong></p>
      </div>
      <form id="form2" novalidate>
        <label for="otp">Verification Code</label>
        <input type="text" id="otp" class="otp-input" placeholder="000000" maxlength="6" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" />
        <button type="submit" id="btn2">Verify & Access Blueprint →</button>
      </form>
      <div id="msg2"></div>
      <div class="timer" id="timer"></div>
      <p class="resend-link">Didn't get it? <button id="resend-btn" type="button">Resend code</button></p>
    </div>
  </div>

  <script>
    var COOKIE_DAYS = 30;
    var currentToken = '';
    var currentEmail = '';
    var timerInterval = null;

    var FREE_DOMAINS = new Set(['gmail.com','googlemail.com','yahoo.com','yahoo.co.uk','yahoo.fr',
      'hotmail.com','hotmail.co.uk','outlook.com','outlook.co.uk','live.com','msn.com',
      'aol.com','icloud.com','me.com','mac.com','protonmail.com','proton.me',
      'tutanota.com','yandex.com','mail.com','gmx.com','inbox.com','fastmail.com',
      'hey.com','duck.com','pm.me','rocketmail.com','qq.com','163.com','126.com']);

    function isPublicDomain(email) {
      return FREE_DOMAINS.has((email.split('@')[1]||'').toLowerCase().trim());
    }

    function getRedirect() {
      return new URLSearchParams(window.location.search).get('redirect') || '/';
    }

    function setCookie(name, value, days) {
      var exp = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = name + '=' + encodeURIComponent(value) + '; expires=' + exp + '; path=/; SameSite=Lax';
    }

    function startTimer(seconds) {
      clearInterval(timerInterval);
      var remaining = seconds;
      var el = document.getElementById('timer');
      el.textContent = 'Code expires in ' + remaining + 's';
      timerInterval = setInterval(function() {
        remaining--;
        if (remaining <= 0) { clearInterval(timerInterval); el.textContent = 'Code expired — please request a new one.'; return; }
        el.textContent = 'Code expires in ' + remaining + 's';
      }, 1000);
    }

    // ── Step 1: Send OTP ──
    document.getElementById('form1').addEventListener('submit', function(e) {
      e.preventDefault();
      var name  = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var btn   = document.getElementById('btn1');
      var msg   = document.getElementById('msg1');

      if (!name || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.style.color = '#c2410c'; msg.textContent = 'Please enter your name and a valid email.'; return;
      }
      if (isPublicDomain(email)) {
        msg.style.color = '#c2410c'; msg.textContent = 'Please use your work or corporate email.'; return;
      }

      btn.disabled = true; btn.textContent = 'Sending code…'; msg.textContent = '';

      var fd = new FormData();
      fd.append('name', name); fd.append('email', email);

      fetch('/api/blueprint-send', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(j) {
          if (j.error === 'work_email') {
            msg.style.color = '#c2410c'; msg.textContent = 'Please use your work or corporate email.';
            btn.disabled = false; btn.textContent = 'Send verification code →'; return;
          }
          if (j.ok) {
            currentToken = j.token;
            currentEmail = email;
            document.getElementById('email-display').textContent = email;
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            document.getElementById('otp').focus();
            startTimer(900);
          } else {
            msg.style.color = '#c2410c';
            msg.textContent = j.detail || j.error || 'Something went wrong — please try again.';
            btn.disabled = false; btn.textContent = 'Send verification code →';
          }
        })
        .catch(function(err) {
          msg.style.color = '#c2410c'; msg.textContent = 'Network error: ' + err.message;
          btn.disabled = false; btn.textContent = 'Send verification code →';
        });
    });

    // ── Step 2: Verify OTP ──
    document.getElementById('form2').addEventListener('submit', function(e) {
      e.preventDefault();
      var otp = document.getElementById('otp').value.trim();
      var btn = document.getElementById('btn2');
      var msg = document.getElementById('msg2');

      if (!otp || otp.length !== 6 || !/^\d{6}$/.test(otp)) {
        msg.style.color = '#c2410c'; msg.textContent = 'Please enter the 6-digit code.'; return;
      }

      btn.disabled = true; btn.textContent = 'Verifying…'; msg.textContent = '';

      var fd = new FormData();
      fd.append('email', currentEmail); fd.append('otp', otp); fd.append('token', currentToken);

      fetch('/api/blueprint-verify', { method: 'POST', body: fd })
        .then(function(r) { return r.json(); })
        .then(function(j) {
          if (j.ok) {
            clearInterval(timerInterval);
            setCookie('jcp_blueprint_access', '1', COOKIE_DAYS);
            msg.style.color = '#15803d'; msg.textContent = 'Verified — opening blueprint…';
            btn.textContent = '✓ Done';
            setTimeout(function() { window.location.href = getRedirect(); }, 700);
          } else {
            msg.style.color = '#c2410c'; msg.textContent = j.error || 'Incorrect code — please try again.';
            btn.disabled = false; btn.textContent = 'Verify & Access Blueprint →';
          }
        })
        .catch(function() {
          msg.style.color = '#c2410c'; msg.textContent = 'Something went wrong — please try again.';
          btn.disabled = false; btn.textContent = 'Verify & Access Blueprint →';
        });
    });

    // ── Resend code ──
    document.getElementById('resend-btn').addEventListener('click', function() {
      document.getElementById('step2').style.display = 'none';
      document.getElementById('step1').style.display = 'block';
      document.getElementById('btn1').disabled = false;
      document.getElementById('btn1').textContent = 'Send verification code →';
      document.getElementById('msg1').textContent = '';
      document.getElementById('otp').value = '';
      clearInterval(timerInterval);
    });

    // Auto-format OTP input
    document.getElementById('otp').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '').slice(0, 6);
      if (this.value.length === 6) document.getElementById('btn2').focus();
    });
  </script>
</body>
</html>
