<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blueprint Access | Jay Prakash</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background: #fafaf8;
      font-family: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Background orbs */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 500px 400px at 10% 10%, rgba(194,65,12,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 90% 90%, rgba(15,118,110,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: #fff;
      border: 1px solid #e7e2dc;
      border-radius: 24px;
      padding: 48px 44px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 8px 40px rgba(28,25,23,0.08);
    }

    .logo {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 18px;
      font-weight: 700;
      color: #c2410c;
      margin-bottom: 28px;
      display: block;
      text-decoration: none;
    }

    .badge {
      display: inline-block;
      background: #c2410c;
      color: #fff;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      color: #1c1917;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .sub {
      font-size: 13px;
      color: #78716c;
      line-height: 1.65;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-family: 'DM Mono', monospace;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .14em;
      color: #78716c;
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"] {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #e7e2dc;
      border-radius: 12px;
      font-size: 14px;
      font-family: inherit;
      color: #1c1917;
      background: #fafaf8;
      margin-bottom: 16px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: #c2410c;
      box-shadow: 0 0 0 3px rgba(194,65,12,.1);
    }

    button {
      width: 100%;
      padding: 13px;
      background: #c2410c;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background .15s;
      margin-top: 2px;
    }

    button:hover:not(:disabled) { background: #a83209; }
    button:disabled { background: #e7e2dc; color: #a8a29e; cursor: not-allowed; }

    #msg {
      margin-top: 14px;
      font-size: 12px;
      text-align: center;
      min-height: 18px;
    }

    .note {
      margin-top: 20px;
      font-size: 11px;
      color: #a8a29e;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <a href="/" class="logo">Jay Prakash</a>
    <span class="badge">Security Blueprints</span>
    <h1>Access this blueprint</h1>
    <p class="sub">Enter your details once to unlock all 256 security blueprints for 30 days.</p>

    <form id="gate-form" novalidate>
      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Your name" required autocomplete="name" />

      <label for="email">Work Email</label>
      <input type="email" id="email" name="email" placeholder="you@company.com" required autocomplete="email" />

      <button type="submit" id="submit-btn">Continue to Blueprint →</button>
    </form>

    <div id="msg"></div>
    <p class="note">Used only to notify the author. No spam, ever.</p>
  </div>

  <script>
    var COOKIE_DAYS = 30;
    var FREE_DOMAINS = new Set(['gmail.com','googlemail.com','yahoo.com','yahoo.co.uk','yahoo.fr',
      'hotmail.com','hotmail.co.uk','hotmail.fr','outlook.com','outlook.co.uk','live.com',
      'msn.com','aol.com','icloud.com','me.com','mac.com','protonmail.com','proton.me',
      'tutanota.com','yandex.com','yandex.ru','mail.com','gmx.com','gmx.net','inbox.com',
      'fastmail.com','hey.com','duck.com','pm.me','rocketmail.com','qq.com','163.com','126.com']);
    function isPublicDomain(email) {
      var domain = (email.split('@')[1] || '').toLowerCase().trim();
      return FREE_DOMAINS.has(domain);
    }

    function getRedirect() {
      var params = new URLSearchParams(window.location.search);
      return params.get('redirect') || '/';
    }

    function setCookie(name, value, days) {
      var expires = new Date(Date.now() + days * 864e5).toUTCString();
      document.cookie = name + '=' + encodeURIComponent(value) +
        '; expires=' + expires + '; path=/; SameSite=Lax';
    }

    document.getElementById('gate-form').addEventListener('submit', function(e) {
      e.preventDefault();

      var name  = document.getElementById('name').value.trim();
      var email = document.getElementById('email').value.trim();
      var btn   = document.getElementById('submit-btn');
      var msg   = document.getElementById('msg');
      var redirect = getRedirect();

      if (!name || !email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        msg.style.color = '#c2410c';
        msg.textContent = 'Please enter your name and a valid email.';
        return;
      }

      btn.disabled    = true;
      btn.textContent = 'Sending…';
      msg.textContent = '';

      var data = new FormData();
      data.append('name',      name);
      data.append('email',     email);
      data.append('blueprint', redirect);
      data.append('page',      window.location.origin + redirect);

      fetch('/api/blueprint-access', { method: 'POST', body: data })
        .then(function(res) { return res.json(); })
        .then(function(json) {
          if (!json.ok && json.error === 'work_email') {
            btn.disabled = false;
            btn.textContent = 'Continue to Blueprint →';
            msg.style.color = '#c2410c';
            msg.textContent = 'Please use your work or corporate email address.';
            return;
          }
          if (json.ok) {
            setCookie('jcp_blueprint_access', '1', COOKIE_DAYS);
            msg.style.color  = '#15803d';
            msg.textContent  = 'Verified — opening blueprint…';
            btn.textContent  = '✓ Done';
            setTimeout(function() {
              window.location.href = redirect;
            }, 700);
          } else {
            throw new Error(json.error || 'failed');
          }
        })
        .catch(function() {
          btn.disabled    = false;
          btn.textContent = 'Continue to Blueprint →';
          msg.style.color = '#c2410c';
          msg.textContent = 'Something went wrong — please try again.';
        });
    });
  </script>
</body>
</html>
